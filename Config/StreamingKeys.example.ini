; Streaming keys for Supermodel PonMi main5 - BUILD INPUT ONLY (11/16).
; Copy this file to Config/StreamingKeys.ini at the top of the source tree and fill in the values.
; Scripts/gen_keys.ps1 (run by the Makefile and by the launcher's build) embeds them into supermodel.exe and
; PonLuncher.exe, scrambled. Config/StreamingKeys.ini is NOT in git and is NOT distributed.
; Without it the builds have no Firebase lobby and no Discord login; connecting by IP still works.
;
; Only values that may be public belong here (anything inside a distributed exe can be dug out):
; never a Discord bot token or a client secret.

FirebaseApiKey = YOUR_FIREBASE_WEB_API_KEY
FirebaseDbUrl = https://YOUR-PROJECT-default-rtdb.REGION.firebasedatabase.app

; Discord login (PKCE). Developer Portal: OAuth2 -> Redirects: http://127.0.0.1:53134/callback, "Public Client" on.
DiscordClientId =
DiscordGuildId =
DiscordRedirectPort = 53134
; shown to hosts who are not members of the guild
DiscordInviteUrl =

; Slot status post: a webhook of the status channel (Channel settings -> Integrations -> Webhooks -> New Webhook).
; A webhook can only post to that channel and edit / delete its own messages. Make the channel read-only for members.
DiscordWebhookUrl =

; Entry-ticket Worker (design 3.8; its code and the key tool are not in this repository): its URL and its public key
TicketUrl =
TicketPublicKey =
