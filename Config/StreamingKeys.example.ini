; Streaming keys for Supermodel PonMi main5 (P6).
; Copy this file to Config/StreamingKeys.ini (next to Supermodel.ini, in every server / client folder)
; and fill in the values. Config/StreamingKeys.ini is NOT in git (.gitignore).
; Without it, the Firebase lobby and Discord login are off; connecting by IP still works.
;
; Never put a Discord client secret here (not needed: PKCE + the player's own token).

FirebaseApiKey = YOUR_FIREBASE_WEB_API_KEY
FirebaseDbUrl = https://YOUR-PROJECT-default-rtdb.REGION.firebasedatabase.app

; Discord login (P6b). Developer Portal: OAuth2 -> Redirects: http://127.0.0.1:53134/callback, "Public Client" on.
DiscordClientId =
DiscordGuildId =
DiscordRedirectPort = 53134
; Launcher only (optional): invite link shown to hosts who are not members of the guild
DiscordInviteUrl =

; Slot status post to a Discord channel (test stage). HOST PCs ONLY - never put the bot token in a client folder.
; The slot-1 server posts one message and keeps it up to date (Supermodel.ini DiscordPost: -1 auto, 0 off, 1 on).
DiscordBotToken =
DiscordChannelId =
